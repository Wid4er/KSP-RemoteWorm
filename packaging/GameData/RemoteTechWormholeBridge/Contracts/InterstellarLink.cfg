CONTRACT_TYPE:NEEDS[ContractConfigurator,RemoteTech]
{
    name = RTWB.InterstellarLink
    minVersion = 2.13.0

    genericTitle = #LOC_RTWB_contract_genericTitle
    genericDescription = #LOC_RTWB_contract_genericDescription
    title = RTWBContractTitle(@/pairId)
    description = RTWBContractDescription(@/pairId)
    synopsis = RTWBContractSynopsis(@/pairId)
    completedMessage = #LOC_RTWB_contract_completed

    prestige = Exceptional
    maxCompletions = 0
    maxSimultaneous = 0
    cancellable = true
    declinable = true
    minExpiry = 30
    maxExpiry = 90

    rewardFunds = RTWBFunds(@/pairId)
    rewardScience = RTWBScience(@/pairId)
    rewardReputation = RTWBReputation(@/pairId)

    DATA
    {
        type = string
        hidden = true
        uniquenessCheck = CONTRACT_ALL
        pairId = RTWBEligiblePairIds().SelectUnique()
    }

    REQUIREMENT
    {
        name = PairStillEligible
        type = RTWBPairAvailable
        title = #LOC_RTWB_contract_requirement
        pairId = @/pairId
        checkOnActiveContract = false
    }

    PARAMETER
    {
        name = GatewayA
        type = RTWBGateway
        ignoreTargetBody = true
        pairId = @/pairId
        mouthId = RTWBMouthA(@/pairId)
        title = RTWBGatewayATitle(@/pairId)
        disableOnStateChange = true
    }

    PARAMETER
    {
        name = GatewayB
        type = RTWBGateway
        ignoreTargetBody = true
        pairId = @/pairId
        mouthId = RTWBMouthB(@/pairId)
        title = RTWBGatewayBTitle(@/pairId)
        disableOnStateChange = true
    }

    PARAMETER
    {
        name = OperationalLink
        type = RTWBLink
        ignoreTargetBody = true
        pairId = @/pairId
        title = RTWBLinkTitle(@/pairId)
        disableOnStateChange = true
    }

    PARAMETER
    {
        name = StableConnection
        type = RTWBStableConnection
        ignoreTargetBody = true
        pairId = @/pairId
        remoteMouthId = RTWBMouthB(@/pairId)
        title = RTWBStableTitle(@/pairId)
        disableOnStateChange = true
    }
}
